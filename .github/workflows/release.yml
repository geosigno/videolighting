name: Release

# Se déclenche quand tu publies une Release sur GitHub (flux manuel "type zustand").
on:
  release:
    types: [ published ]

# OIDC Trusted Publishing : id-token génère un jeton éphémère + la provenance.
# Aucun NPM_TOKEN nécessaire.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # npm (pas bun) gère l'OIDC ; Node 24 + npm@latest garantit npm >= 11.5.1.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      # `npm publish` déclenche `prepublishOnly` (build + publint + attw),
      # puis publie avec provenance (via publishConfig) sans token grâce à l'OIDC.
      # The first version of a package is published by hand (trusted publishing needs the
      # package to exist): do nothing if this version is already on npm.
      - name: Publish to npm
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "videolighting@$version" version > /dev/null 2>&1; then
            echo "videolighting@$version is already on npm"
          else
            # npm refuses a prerelease without a tag: 1.0.0-alpha.1 goes to "alpha", 1.0.0 to "latest".
            tag=$(node -p "require('./package.json').version.split('-')[1]?.split('.')[0] ?? 'latest'")
            npm publish --tag "$tag"
          fi
