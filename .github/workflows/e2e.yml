name: E2E

on:
  push:
    branches: [ master ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    # Chromium and Firefox on Linux, WebKit (the engine of Safari) on macOS: the
    # Linux build of WebKit is not the one that ships. One test at a time.
    # The runners have no GPU: the time budgets are scaled (see test/end-to-end/budgets.ts).
    name: e2e (${{ matrix.browsers }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browsers: chromium firefox
            projects: --project=chromium --project=firefox
          - os: macos-latest
            browsers: webkit
            projects: --project=webkit
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install browsers
        run: bunx playwright install --with-deps ${{ matrix.browsers }}

      - name: End-to-end tests
        run: bun run test:e2e ${{ matrix.projects }}

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report
            test-results
          retention-days: 7
