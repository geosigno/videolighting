name: E2E

on:
  push:
    branches: [ master ]
  pull_request:
  # WebKit: every night, and by hand (Actions tab).
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# A shared runner has no GPU and a busy CPU: the tests of speed (tagged `@perf`:
# frame rate, time budgets) mean nothing there and are left out. Run them on a
# real machine with `bun run test:e2e`.
jobs:
  e2e:
    if: github.event_name != 'schedule'
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [ chromium, firefox ]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install browser
        run: bunx playwright install --with-deps ${{ matrix.browser }}

      - name: End-to-end tests (${{ matrix.browser }})
        run: bun run test:e2e --project=${{ matrix.browser }} --grep-invert @perf

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  # WebKit (the engine of Safari) on macOS: the Linux build is not the one that ships.
  # Slow (about 12 minutes) and not stable yet: by hand and every night, not on each push.
  webkit:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install browser
        run: bunx playwright install webkit

      - name: End-to-end tests (webkit)
        run: bun run test:e2e --project=webkit --grep-invert @perf

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-webkit
          path: |
            playwright-report
            test-results
          retention-days: 7
