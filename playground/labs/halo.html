<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Glow halo lab</title>
  </head>
  <body>
    <header class="top">
      <h1>Halo: how the glow fades out</h1>
      <p>
        Same colours, same video, four ways to fade the glow into nothing. No
        saturation anywhere. Throwaway lab: the library's default is unchanged.
      </p>
      <div class="controls inline">
        <label
          >source
          <select id="source">
            <option value="mux">Video.js demo (Mux)</option>
            <option value="/static.mp4">static edges</option>
            <option value="/mire.mp4">mire</option>
          </select>
        </label>
        <label
          >reach × <output id="reach-out">1.0</output>
          <input
            id="reach"
            max="1.6"
            min="0.5"
            step="0.05"
            type="range"
            value="1"
          >
        </label>
        <label
          >strength at the edge <output id="opacity-out">0.85</output>
          <input
            id="opacity"
            max="1"
            min="0.3"
            step="0.05"
            type="range"
            value="0.85"
          >
        </label>
      </div>
    </header>
    <video autoplay class="offscreen" id="video" loop muted playsinline></video>
    <main class="halo-grid" id="grid"></main>
    <script src="./halo.ts" type="module"></script>
  </body>
</html>
